<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - NoteLib</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { font-size: 0.875rem; color: #94A3B8; line-height: 1.6; }
    button {
      margin-top: 0.5rem;
      padding: 0.625rem 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #1E293B;
      color: #F8FAFC;
      font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="card">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4F8CFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.364 5.636a9 9 0 1 1-12.728 0"/><path d="M12 2v8"/></svg>
    <h1>You're offline</h1>
    <p>NoteLib needs a connection to load your notes and quizzes. Check your network and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
