<!-- Source of truth for /og-image-v2.png. Render at exactly 1200x630 (the 1.91:1 Open Graph
     ratio) — any other aspect ratio gets centre-cropped by Facebook/LinkedIn/X, which cuts the
     brand lockup off the top and notelib.app off the bottom.
     Render with: npx sharp or node -e "require('sharp')(svg,{density:300}).resize(1200,630)".
     xml:space="preserve" on the two multi-tspan text runs is REQUIRED: trailing spaces inside a
     tspan are collapsed by strict SVG renderers (browsers keep them), which silently produced
     "yourstudy system." and "notes intoStudy Packs". -->
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">NoteLib — Your notes become your study system</title>
<desc id="desc">Open Graph image showing a note transforming into a Study Pack with Summary, Key Concepts, Quiz, and Flashcards.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630"><stop stop-color="#FCFDFE"/><stop offset="1" stop-color="#F3F6FA"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="72" y2="72"><stop stop-color="#4EA1F1"/><stop offset="1" stop-color="#2F6FED"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#101828" flood-opacity="0.10"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#101828" flood-opacity="0.08"/></filter>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<path d="M0 492C144 458 259 522 418 503C575 483 688 404 852 419C1017 434 1092 492 1200 470V630H0V492Z" fill="#EEF4FC"/>

<!-- Brand lockup -->
<g transform="translate(58 42)">
  <rect width="72" height="72" rx="20" fill="url(#brand)" filter="url(#soft)"/>
  <text x="36" y="49" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">NL</text>
  <text x="98" y="52" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">NoteLib</text>
</g>

<!-- Headline + body -->
<text xml:space="preserve" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5"><tspan x="62" y="200">Your notes become</tspan><tspan x="62" y="278">your </tspan><tspan fill="#2F6FED">study system.</tspan></text>
<text xml:space="preserve" fill="#344054" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="400"><tspan x="62" y="354">Turn your notes into </tspan><tspan fill="#2F6FED" font-weight="700">Study Packs</tspan><tspan x="62" y="395">with summaries, key concepts,</tspan><tspan x="62" y="436">quizzes, flashcards, and more—</tspan><tspan x="62" y="477">so you can study smarter.</tspan></text>

<!-- Footer -->
<g transform="translate(58 562)">
  <circle cx="18" cy="18" r="18" fill="#E7F0FF"/>
  <path d="M18 10V26M10 18H26" stroke="#2F6FED" stroke-width="2.6" stroke-linecap="round"/>
  <text x="56" y="26" fill="#475467" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500">All from your notes. <tspan fill="#2F6FED" font-weight="700">All in one place.</tspan></text>
  <line x1="492" y1="2" x2="492" y2="34" stroke="#D0D5DD" stroke-width="1.5"/>
  <g transform="translate(528 0)">
    <circle cx="18" cy="18" r="17.5" fill="#2F6FED"/>
    <g stroke="#FFFFFF" stroke-width="1.7" fill="none" stroke-linecap="round">
      <circle cx="18" cy="18" r="10.5"/>
      <path d="M7.5 18H28.5"/>
      <ellipse cx="18" cy="18" rx="4.6" ry="10.5"/>
    </g>
  </g>
  <text x="578" y="26" fill="#344054" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">notelib.app</text>
</g>

<!-- Note → Study Pack diagram -->
<g transform="translate(700 0)">

  <!-- Your Note card -->
  <rect x="50" y="24" width="360" height="114" rx="22" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="58" text-anchor="middle" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Your Note</text>
  <g transform="translate(80 68) scale(0.85)">
    <path d="M0 0H45L61 16V62H0V0Z" fill="#DCE9FF"/>
    <path d="M45 0V16H61Z" fill="#AFCBFF"/>
    <rect x="12" y="24" width="26" height="5" rx="2.5" fill="#2F80ED"/>
    <rect x="12" y="36" width="31" height="5" rx="2.5" fill="#7BAAF4"/>
    <rect x="12" y="48" width="27" height="5" rx="2.5" fill="#ABC8F3"/>
  </g>
  <g transform="translate(166 74)">
    <rect width="200" height="9" rx="4.5" fill="#D0D5DD"/>
    <rect y="20" width="142" height="9" rx="4.5" fill="#E4E7EC"/>
    <rect y="40" width="186" height="9" rx="4.5" fill="#D0D5DD"/>
  </g>

  <!-- Connector -->
  <path d="M230 138V162" stroke="#9EC1FA" stroke-width="3" stroke-dasharray="7 8"/>
  <path d="M104 208V196Q104 188 112 188H348Q356 188 356 196V208" stroke="#B8D0FB" stroke-width="3" stroke-dasharray="8 8" fill="none"/>

  <!-- Sparkles -->
  <path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#93C5FD" transform="translate(58 176) scale(0.8)"/>
  <path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#FBBF24" transform="translate(386 174) scale(0.9)"/>

  <!-- Arrow -->
  <circle cx="230" cy="186" r="25" fill="#2F6FED" filter="url(#soft)"/>
  <path d="M230 174V196M221 188L230 197L239 188" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Study Pack card -->
  <rect x="0" y="208" width="460" height="336" rx="26" fill="#F0F5FE" stroke="#C9DBFA" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(32 232)">
    <path d="M0 31L19 22L38 31L19 40L0 31Z" fill="#A5C4F7"/>
    <path d="M0 20L19 11L38 20L19 29L0 20Z" fill="#6E9BF2"/>
    <path d="M0 9L19 0L38 9L19 18L0 9Z" fill="#2F6FED"/>
  </g>
  <text x="88" y="260" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="-0.3">Study Pack</text>

  <rect x="22" y="284" width="416" height="244" rx="20" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5"/>

  <!-- Summary -->
  <g transform="translate(40 300)">
    <rect width="50" height="50" rx="14" fill="#E8F1FF"/>
    <path d="M14 12H31L38 19V38H14V12Z" stroke="#2F6FED" stroke-width="2.4" stroke-linejoin="round" fill="none"/>
    <path d="M31 12V19H38" stroke="#2F6FED" stroke-width="2.4" stroke-linejoin="round" fill="none"/>
    <text x="62" y="22" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Summary</text>
    <text x="62" y="44" fill="#667085" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Understand the big picture.</text>
  </g>
  <line x1="40" y1="362" x2="420" y2="362" stroke="#EAECF0" stroke-width="1.5"/>

  <!-- Key Concepts -->
  <g transform="translate(40 374)">
    <rect width="50" height="50" rx="14" fill="#E7F8ED"/>
    <path d="M22 16H38M22 25H38M22 34H36" stroke="#12A150" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M11 16L14 19L19 13M11 25L14 28L19 22M11 34L14 37L19 31" stroke="#12A150" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="62" y="22" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Key Concepts</text>
    <text x="62" y="44" fill="#667085" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Focus on what matters.</text>
  </g>
  <line x1="40" y1="436" x2="420" y2="436" stroke="#EAECF0" stroke-width="1.5"/>
  <line x1="226" y1="440" x2="226" y2="524" stroke="#EAECF0" stroke-width="1.5"/>

  <!-- Quiz -->
  <g transform="translate(40 448)">
    <rect width="50" height="50" rx="14" fill="#FFF4E0"/>
    <circle cx="25" cy="25" r="13" stroke="#F59E0B" stroke-width="2.4" fill="none"/>
    <path d="M21 21C21 18.8 22.8 17 25 17C27.2 17 29 18.8 29 21C29 24.2 25 24 25 27" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="32" r="1.8" fill="#F59E0B"/>
    <text x="61" y="20" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Quiz</text>
    <text fill="#667085" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400"><tspan x="61" y="42">Test your</tspan><tspan x="61" y="61">understanding.</tspan></text>
  </g>

  <!-- Flashcards -->
  <g transform="translate(244 448)">
    <rect width="50" height="50" rx="14" fill="#F3EDFF"/>
    <rect x="14" y="13" width="24" height="24" rx="3.5" stroke="#7F56D9" stroke-width="2.4" fill="none"/>
    <path d="M19 20H33M19 25H33M19 30H29" stroke="#7F56D9" stroke-width="2.2" stroke-linecap="round"/>
    <text x="61" y="20" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Flashcards</text>
    <text fill="#667085" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="400"><tspan x="61" y="42">Remember</tspan><tspan x="61" y="61">better.</tspan></text>
  </g>

</g>
</svg>
