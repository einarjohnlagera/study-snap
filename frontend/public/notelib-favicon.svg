<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NoteLib icon</title>
  <desc id="desc">A tilted note page with a green spark for NoteLib.</desc>
  <defs>
    <linearGradient id="paperBlue" x1="13" y1="18" x2="39" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="paperFace" x1="19" y1="12" x2="43" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DDE7F5"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="26" y1="24" x2="35" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="36" y1="10" x2="50" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3E635"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect x="10" y="18" width="28" height="33" rx="6" transform="rotate(-10 10 18)" fill="url(#paperBlue)"/>
  <rect x="17" y="11" width="28" height="33" rx="6" transform="rotate(-10 17 11)" fill="url(#paperFace)"/>

  <rect x="27" y="24" width="10" height="3" rx="1.5" transform="rotate(-10 27 24)" fill="url(#lineGrad)"/>
  <rect x="26" y="31" width="14" height="3" rx="1.5" transform="rotate(-10 26 31)" fill="url(#lineGrad)"/>
  <rect x="25" y="38" width="12" height="3" rx="1.5" transform="rotate(-10 25 38)" fill="url(#lineGrad)"/>

  <path d="M40 10L33 23H39L36 34L49 19H43L46 10H40Z" fill="url(#sparkGrad)"/>
</svg>
