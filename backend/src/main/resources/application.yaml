spring:
  application:
    name: notelib-backend
  config:
    import: optional:file:backend/.env[.properties],optional:file:../backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:study_snap}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMPORT_FILE_SIZE:10MB}
      max-request-size: ${MAX_IMPORT_FILE_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    root: ${LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

studysnap:
  app-name: NoteLib
  settings:
    max-notes-chars: ${MAX_NOTES_CHARS_FREE:12000}
    max-image-bytes: ${MAX_IMAGE_BYTES:5000000}
    quiz-questions-free: ${QUIZ_QUESTIONS_FREE:5}
    model-free: ${LLM_MODEL_FREE:gpt-4.1-mini}
    model-premium: ${LLM_MODEL_PREMIUM:gpt-4.1}
    prompt-dir: ${LLM_PROMPT_DIR:prompts/study-pack-v1}
  ocr:
    provider: ${OCR_PROVIDER:stub}
    confidence-threshold: ${OCR_CONFIDENCE_THRESHOLD:0.8}
    min-detected-chars: ${OCR_MIN_DETECTED_CHARS:30}
    min-detected-words: ${OCR_MIN_DETECTED_WORDS:6}
    hard-reject-confidence: ${OCR_HARD_REJECT_CONFIDENCE:0.45}
    free-monthly-upload-limit: ${OCR_FREE_MONTHLY_UPLOAD_LIMIT:20}
    premium-monthly-upload-limit: ${OCR_PREMIUM_MONTHLY_UPLOAD_LIMIT:100}
    free-max-image-bytes: ${OCR_FREE_MAX_IMAGE_BYTES:5000000}
    premium-max-image-bytes: ${OCR_PREMIUM_MAX_IMAGE_BYTES:10000000}
    max-pages-per-upload: ${OCR_MAX_PAGES_PER_UPLOAD:1}
    free-rate-limit-per-minute: ${OCR_FREE_RATE_LIMIT_PER_MINUTE:6}
    premium-rate-limit-per-minute: ${OCR_PREMIUM_RATE_LIMIT_PER_MINUTE:20}
    google-application-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
    google-application-credentials-json: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:}
  llm:
    api:
      provider: ${LLM_PROVIDER:openai}
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  quick-review:
    study-tip:
      enabled: ${QUICK_REVIEW_STUDY_TIP_ENABLED:false}
      min-incorrect-count: ${QUICK_REVIEW_STUDY_TIP_MIN_INCORRECT_COUNT:1}
      max-questions: ${QUICK_REVIEW_STUDY_TIP_MAX_QUESTIONS:3}
  pricing:
    free-monthly-study-pack-limit: ${FREE_MONTHLY_STUDY_PACK_LIMIT:10}
    premium-monthly-study-pack-limit: ${PREMIUM_MONTHLY_STUDY_PACK_LIMIT:100}
    free-monthly-challenge-quiz-limit: ${FREE_MONTHLY_CHALLENGE_QUIZ_LIMIT:5}
    premium-monthly-challenge-quiz-limit: ${PREMIUM_MONTHLY_CHALLENGE_QUIZ_LIMIT:50}
    premium-monthly-adaptive-practice-limit: ${PREMIUM_MONTHLY_ADAPTIVE_PRACTICE_LIMIT:30}
    free-monthly-ocr-limit: ${FREE_MONTHLY_OCR_LIMIT:20}
    premium-monthly-ocr-limit: ${PREMIUM_MONTHLY_OCR_LIMIT:100}
    adaptive-practice-premium-only: ${ADAPTIVE_PRACTICE_PREMIUM_ONLY:true}
    difficulty-selection-premium-only: ${DIFFICULTY_SELECTION_PREMIUM_ONLY:true}
  limits:
    file-upload-max-size: ${MAX_IMPORT_FILE_SIZE:10}
    txt-upload-max-size: ${TXT_IMPORT_MAX_SIZE:1}
    pdf-upload-max-size: ${PDF_IMPORT_MAX_SIZE:10}
    docx-upload-max-size: ${DOCX_IMPORT_MAX_SIZE:10}
    pdf-max-pages: ${PDF_IMPORT_MAX_PAGES:30}
    extracted-text-max-length: ${EXTRACTED_TEXT_MAX_LENGTH:200000}
    free-ai-rate-limit-per-minute: ${AI_FREE_RATE_LIMIT_PER_MINUTE:5}
    premium-ai-rate-limit-per-minute: ${AI_PREMIUM_RATE_LIMIT_PER_MINUTE:20}
    free-ocr-rate-limit-per-minute: ${OCR_FREE_RATE_LIMIT_PER_MINUTE:6}
    premium-ocr-rate-limit-per-minute: ${OCR_PREMIUM_RATE_LIMIT_PER_MINUTE:20}
  billing:
    provider: ${BILLING_PROVIDER:PAYMONGO}
    pricing-regions:
      US:
        currency: USD
        monthly-price: ${PRICING_US_MONTHLY_PRICE:4.99}
        yearly-price: ${PRICING_US_YEARLY_PRICE:39.99}
        paymongo-monthly-plan-id: ${PAYMONGO_US_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_US_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_US_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_US_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_US_ACTIVE:true}
      PH:
        currency: PHP
        monthly-price: ${PRICING_PH_MONTHLY_PRICE:249}
        yearly-price: ${PRICING_PH_YEARLY_PRICE:1999}
        paymongo-monthly-plan-id: ${PAYMONGO_PH_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_PH_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_PH_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_PH_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_PH_ACTIVE:true}
      GB:
        currency: GBP
        monthly-price: ${PRICING_GB_MONTHLY_PRICE:4.49}
        yearly-price: ${PRICING_GB_YEARLY_PRICE:35.99}
        paymongo-monthly-plan-id: ${PAYMONGO_GB_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_GB_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_GB_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_GB_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_GB_ACTIVE:true}
      EU:
        currency: EUR
        monthly-price: ${PRICING_EU_MONTHLY_PRICE:4.99}
        yearly-price: ${PRICING_EU_YEARLY_PRICE:39.99}
        paymongo-monthly-plan-id: ${PAYMONGO_EU_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_EU_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_EU_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_EU_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_EU_ACTIVE:true}
      AU:
        currency: AUD
        monthly-price: ${PRICING_AU_MONTHLY_PRICE:7.49}
        yearly-price: ${PRICING_AU_YEARLY_PRICE:59.99}
        paymongo-monthly-plan-id: ${PAYMONGO_AU_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_AU_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_AU_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_AU_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_AU_ACTIVE:true}
      CA:
        currency: CAD
        monthly-price: ${PRICING_CA_MONTHLY_PRICE:6.49}
        yearly-price: ${PRICING_CA_YEARLY_PRICE:51.99}
        paymongo-monthly-plan-id: ${PAYMONGO_CA_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_CA_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_CA_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_CA_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_CA_ACTIVE:true}
      SG:
        currency: SGD
        monthly-price: ${PRICING_SG_MONTHLY_PRICE:6.49}
        yearly-price: ${PRICING_SG_YEARLY_PRICE:51.99}
        paymongo-monthly-plan-id: ${PAYMONGO_SG_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_SG_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_SG_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_SG_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_SG_ACTIVE:true}
      IN:
        currency: INR
        monthly-price: ${PRICING_IN_MONTHLY_PRICE:399}
        yearly-price: ${PRICING_IN_YEARLY_PRICE:3199}
        paymongo-monthly-plan-id: ${PAYMONGO_IN_MONTHLY_PLAN_ID:${PAYMONGO_MONTHLY_PLAN_ID:}}
        paymongo-yearly-plan-id: ${PAYMONGO_IN_YEARLY_PLAN_ID:${PAYMONGO_YEARLY_PLAN_ID:}}
        paymongo-intro-monthly-plan-id: ${PAYMONGO_IN_INTRO_MONTHLY_PLAN_ID:}
        paymongo-intro-yearly-plan-id: ${PAYMONGO_IN_INTRO_YEARLY_PLAN_ID:}
        active: ${PRICING_IN_ACTIVE:true}
    stripe:
      api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com/v1}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}
      checkout-success-url: ${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:3000/settings?checkout=success}
      checkout-cancel-url: ${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:3000/settings?checkout=cancel}
    paymongo:
      api-base-url: ${PAYMONGO_API_BASE_URL:https://api.paymongo.com/v1}
      secret-key: ${PAYMONGO_SECRET_KEY:}
      webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:}
      monthly-plan-id: ${PAYMONGO_MONTHLY_PLAN_ID:}
      yearly-plan-id: ${PAYMONGO_YEARLY_PLAN_ID:}
      monthly-amount: ${PAYMONGO_MONTHLY_AMOUNT:4.99}
      yearly-amount: ${PAYMONGO_YEARLY_AMOUNT:39.99}
      checkout-success-url: ${PAYMONGO_CHECKOUT_SUCCESS_URL:http://localhost:3000/settings?checkout=success}
      checkout-cancel-url: ${PAYMONGO_CHECKOUT_CANCEL_URL:http://localhost:3000/settings?checkout=cancel}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    resend-api-base-url: ${RESEND_API_BASE_URL:https://api.resend.com}
    from: ${EMAIL_FROM:}
    support: ${EMAIL_SUPPORT:support@mail.notelib.app}
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    verification-token-hours: ${EMAIL_VERIFICATION_TOKEN_HOURS:24}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
  retention:
    daily-cron: ${RETENTION_DAILY_CRON:0 45 2 * * *}
    inactivity-days: ${RETENTION_INACTIVITY_DAYS:7}
    inactivity-cooldown-days: ${RETENTION_INACTIVITY_COOLDOWN_DAYS:7}
    weak-concept-cooldown-days: ${RETENTION_WEAK_CONCEPT_COOLDOWN_DAYS:5}
    unfinished-note-days: ${RETENTION_UNFINISHED_NOTE_DAYS:2}
    unfinished-note-cooldown-days: ${RETENTION_UNFINISHED_NOTE_COOLDOWN_DAYS:3}
    weak-concept-threshold-percent: ${RETENTION_WEAK_CONCEPT_THRESHOLD_PERCENT:60}
  security:
    jwt:
      secret: ${JWT_SECRET:replace-this-in-env-with-a-long-secret-at-least-32-chars}
      issuer: ${JWT_ISSUER:notelib}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:1}
      refresh-token-days-keep-signed-in: ${JWT_REFRESH_TOKEN_DAYS_KEEP_SIGNED_IN:30}
    auth:
      max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
      lock-minutes: ${AUTH_LOCK_MINUTES:15}
      auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
