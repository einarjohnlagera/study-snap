    plus-monthly-docx-export-limit: ${PLUS_MONTHLY_DOCX_EXPORT_LIMIT:15}
    pro-monthly-docx-export-limit: ${PRO_MONTHLY_DOCX_EXPORT_LIMIT:-1}
