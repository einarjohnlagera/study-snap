spring:
  application:
    name: notelib-backend
  config:
    import: optional:file:backend/.env[.properties],optional:file:../backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:study_snap}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # ⚠️ THESE THREE KEYS DID NOT EXIST BEFORE v0.112.0, AND THEIR ABSENCE IS WHAT TOOK PRODUCTION
    # DOWN ON 2026-09-04. There was no HikariCP configuration anywhere, so `total=10` was Hikari's
    # DEFAULT maximumPoolSize and `30001 ms` its DEFAULT connectionTimeout — nobody chose either.
    # The pool was exhausted and DataSourceHealthIndicator then starved on the same pool: it needs a
    # connection to answer /actuator/health, queued behind the same 30 s acquisition timeout, failed
    # at 30,002 ms, and Render replaced the instance ~65 s later. The server did not crash; it was
    # killed for failing a health check it could no longer answer.
    # Full diagnosis: docs/claude-findings/2026-09-04-prod-outage-hikari-pool-exhaustion.md
    hikari:
      # Logs a full stack trace for any connection held past 60 s, naming the offending path the next
      # time this happens. Zero behaviour change. §8a rates this above the pool bump.
      # ⚠️ CORRECTED v0.114.0: this comment used to call leak detection "the instrument Phase 2 reads to
      # settle the open-in-view question", and reading that literally is what led a later kickoff to
      # conclude Phase 2 had never run. It had. Phase 2 settled the question with a DIRECT read of the
      # effective handling mode (ConnectionHandlingModeContractTest, v0.112.0) plus the startup line from
      # ConnectionLifetimeStartupLogger — because leak detection reports that a connection was held past
      # 60 s and BY WHOM, and never whether it stayed bound AFTER the transaction closed, which was the
      # actual question. What leak detection is for is the SEPARATE question [CHECKPOINT — due 2026-10-04]
      # asks: whether the holds are across slow external calls, or an outright leak.
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
      # ⚠️ THE CEILING IS A DEPLOY-OVERLAP BOUND, NOT A PERFORMANCE KNOB. Render runs the NEW instance
      # alongside the OLD during a deploy, each with its own pool, so the safe bound is roughly
      # `N <= (max_connections - reserved) / 2`. Render Postgres allows >=100 connections on every
      # plan minus ~10 reserved, so 20 is safe on the SMALLEST plan (needs only max_connections >= 50)
      # and does not depend on which plan is live. Raising this past 45 requires reading the real
      # limit from the Render dashboard and confirming with `SHOW max_connections;` first —
      # DataSourcePoolContractTest enforces that bound.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      # ⚠️ A DELIBERATE TRADE, NOT AN OPTIMISATION (owner decision, 2026-09-04). Waiters now fail fast
      # with a 500 instead of queueing 30 s. That queueing is precisely what let the health check blow
      # past Render's probe threshold and get the instance killed, so this trades user-visible errors
      # for staying up. It was shipped WITH the pool bump rather than deferred to Phase 3, accepting
      # that until Phase 3 shortens the holds, some requests that would have queued-then-succeeded
      # now return 500 instead.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMPORT_FILE_SIZE:10MB}
      max-request-size: ${MAX_IMPORT_FILE_SIZE:10MB}

note:
  import:
    max-batch-files: ${NOTE_IMPORT_MAX_BATCH_FILES:20}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    threads:
      # Render Starter is 0.5 CPU / 512 MB. The Spring Boot default of 200 worker
      # threads is pointless at 0.5 CPU and a native-memory hog (~1 MB stack each)
      # that starves the heap. Cap it so the JVM fits the container.
      max: ${SERVER_TOMCAT_THREADS_MAX:25}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # metrics exposes jvm.memory.used/max (tagged heap vs nonheap), jvm.gc.pause,
        # and thread counts via GET /actuator/metrics/{name} — not permitAll (see
        # SecurityConfig), so this stays authenticated-only. Added so a future memory
        # incident can be diagnosed from live metrics instead of inferring
        # heap-vs-native from the presence/absence of an OutOfMemoryError log line.
        include: health,metrics
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

studysnap:
  app-name: NoteLib
  settings:
    max-notes-chars: ${MAX_NOTES_CHARS_FREE:12000}
    max-image-bytes: ${MAX_IMAGE_BYTES:5000000}
    quiz-questions-free: ${QUIZ_QUESTIONS_FREE:5}
    model-free: ${LLM_MODEL_FREE:gpt-4.1-mini}
    model-premium: ${LLM_MODEL_PREMIUM:gpt-4.1}
    model-critique: ${LLM_MODEL_CRITIQUE:gpt-4.1-mini}
    prompt-dir: ${LLM_PROMPT_DIR:prompts/study-pack-v1}
  ocr:
    enabled: ${OCR_ENABLED:true}
    provider: ${OCR_PROVIDER:stub}
    confidence-threshold: ${OCR_CONFIDENCE_THRESHOLD:0.8}
    min-detected-chars: ${OCR_MIN_DETECTED_CHARS:30}
    min-detected-words: ${OCR_MIN_DETECTED_WORDS:6}
    hard-reject-confidence: ${OCR_HARD_REJECT_CONFIDENCE:0.45}
    free-monthly-upload-limit: ${OCR_FREE_MONTHLY_UPLOAD_LIMIT:20}
    premium-monthly-upload-limit: ${OCR_PREMIUM_MONTHLY_UPLOAD_LIMIT:100}
    free-max-image-bytes: ${OCR_FREE_MAX_IMAGE_BYTES:5000000}
    premium-max-image-bytes: ${OCR_PREMIUM_MAX_IMAGE_BYTES:10000000}
    max-pages-per-upload: ${OCR_MAX_PAGES_PER_UPLOAD:1}
    free-rate-limit-per-minute: ${OCR_FREE_RATE_LIMIT_PER_MINUTE:6}
    premium-rate-limit-per-minute: ${OCR_PREMIUM_RATE_LIMIT_PER_MINUTE:20}
    google-application-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
    google-application-credentials-json: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:}
  llm:
    api:
      provider: ${LLM_PROVIDER:openai}
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:10}
      # ⚠️ UNCHANGED AT 180 s — made overridable, NOT shortened. Every path that holds a JDBC
      # connection across an LLM call holds it for up to this long, so this is the ceiling on a
      # connection hold until Phase 3 removes the hold entirely. The 2026-09-04 finding suggests
      # ~90 s but argues no specific number; one RestClient serves every call including the largest
      # Study Pack generation, so cutting it without latency data would convert working generations
      # into failures. Dial it down from the environment once Phase 2's leak-detection output shows
      # what real holds actually cost.
      read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:180}
  quiz-generation:
    mode: ${QUIZ_GENERATION_MODE:real}
    mock-delay-ms: ${QUIZ_GENERATION_MOCK_DELAY_MS:0}
  quick-review:
    study-tip:
      enabled: ${QUICK_REVIEW_STUDY_TIP_ENABLED:false}
      min-incorrect-count: ${QUICK_REVIEW_STUDY_TIP_MIN_INCORRECT_COUNT:1}
      max-questions: ${QUICK_REVIEW_STUDY_TIP_MAX_QUESTIONS:3}
  pricing:
    free-monthly-study-pack-limit: ${FREE_MONTHLY_STUDY_PACK_LIMIT:10}
    plus-monthly-study-pack-limit: ${PLUS_MONTHLY_STUDY_PACK_LIMIT:50}
    pro-monthly-study-pack-limit: ${PRO_MONTHLY_STUDY_PACK_LIMIT:100}
    free-monthly-challenge-quiz-limit: ${FREE_MONTHLY_CHALLENGE_QUIZ_LIMIT:20}
    plus-monthly-challenge-quiz-limit: ${PLUS_MONTHLY_CHALLENGE_QUIZ_LIMIT:100}
    pro-monthly-challenge-quiz-limit: ${PRO_MONTHLY_CHALLENGE_QUIZ_LIMIT:200}
    free-monthly-multi-note-limit: ${FREE_MONTHLY_MULTI_NOTE_LIMIT:2}
    plus-monthly-multi-note-limit: ${PLUS_MONTHLY_MULTI_NOTE_LIMIT:10}
    pro-monthly-multi-note-limit: ${PRO_MONTHLY_MULTI_NOTE_LIMIT:200}
    free-multi-note-source-cap: ${FREE_MULTI_NOTE_SOURCE_CAP:3}
    free-monthly-adaptive-practice-limit: ${FREE_MONTHLY_ADAPTIVE_PRACTICE_LIMIT:3}
    plus-monthly-adaptive-practice-limit: ${PLUS_MONTHLY_ADAPTIVE_PRACTICE_LIMIT:10}
    pro-monthly-adaptive-practice-limit: ${PRO_MONTHLY_ADAPTIVE_PRACTICE_LIMIT:30}
    pro-monthly-interview-practice-limit: ${PRO_MONTHLY_INTERVIEW_PRACTICE_LIMIT:10}
    free-monthly-ask-companion-limit: ${FREE_MONTHLY_ASK_COMPANION_LIMIT:0}
    plus-monthly-ask-companion-limit: ${PLUS_MONTHLY_ASK_COMPANION_LIMIT:20}
    pro-monthly-ask-companion-limit: ${PRO_MONTHLY_ASK_COMPANION_LIMIT:20}
