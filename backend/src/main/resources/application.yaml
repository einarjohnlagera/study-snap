    plus-monthly-pdf-export-limit: ${PLUS_MONTHLY_PDF_EXPORT_LIMIT:15}
    pro-monthly-pdf-export-limit: ${PRO_MONTHLY_PDF_EXPORT_LIMIT:-1}
    adaptive-practice-pro-only: ${ADAPTIVE_PRACTICE_PRO_ONLY:false}
    interview-practice-pro-only: ${INTERVIEW_PRACTICE_PRO_ONLY:true}
    long-exam-pool-size: ${LONG_EXAM_POOL_SIZE:48}
    board-exam-pool-size: ${BOARD_EXAM_POOL_SIZE:24}
    board-exam-target-question-count: ${BOARD_EXAM_TARGET_QUESTION_COUNT:30}
    board-exam-minimum-assembled-questions: ${BOARD_EXAM_MINIMUM_ASSEMBLED_QUESTIONS:10}
    board-exam-minimum-contributing-sources: ${BOARD_EXAM_MINIMUM_CONTRIBUTING_SOURCES:2}
    # Kill-switch for eager exam-pool pre-warming (fires automatically on every Study
    # Pack generation, not on actual Long/Board Exam usage). Default off: with zero
    # Pro users today, this is pure LLM-fan-out cost/memory pressure for zero value.
    # A real Long/Board Exam start still works when this is off — its first use can
    # live-generate and then create a per-user pool for later sessions.
    exam-pool-prewarm-enabled: ${EXAM_POOL_PREWARM_ENABLED:false}
  linked-learners:
    # Conservative engineering default pending counsel; this is not a legal position.
    guardian-consent-max-age: ${GUARDIAN_CONSENT_MAX_AGE:17}
    # An email-keyed invitation is a standing offer to whoever controls the address, so it lapses.
    invitation-ttl-days: ${INVITATION_TTL_DAYS:30}
    # Separate from the invitation/link carrier clock: this dates a relationship request from creation.
    request-ttl-days: ${REQUEST_TTL_DAYS:30}
    # Env hook for the expiry sweep, matching studysnap.generation.recovery-cron. Without a bound
    # field the placeholder resolved but nothing could override it in an environment.
    request-expiry-cron: ${REQUEST_EXPIRY_CRON:0 45 2 * * *}
    # Work per sweep run, not a cap on what may expire: the remainder is picked up by the next run.
    expiry-sweep-batch-size: ${EXPIRY_SWEEP_BATCH_SIZE:500}
    # Two keys on purpose: volume, and per-address so one victim cannot be hammered.
    invites-per-window: ${INVITES_PER_WINDOW:20}
    invites-per-address-per-window: ${INVITES_PER_ADDRESS_PER_WINDOW:3}
    # Separate creator bucket: links do not have an address key, but their creation is still metered.
    invitation-links-per-window: ${INVITATION_LINKS_PER_WINDOW:20}
    invite-rate-limit-window-hours: ${INVITE_RATE_LIMIT_WINDOW_HOURS:24}
  limits:
